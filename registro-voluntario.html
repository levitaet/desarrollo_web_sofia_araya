<!DOCTYPE html>
<html lang="es">

<head>
  <title>Registro de voluntarios</title>
  <link rel="stylesheet" type="text/css" href="../css/registro.css">
</head>

<body>
  <div class="container">
    <div class="logo">
      <img id="logo-id" src="./img/ave.svg" alt="Logo de ave" />
      <p id="bajada">Regístrate para unirte a la causa :D</p>
    </div>
    <form class="formulario" id="login-form">
      <div id="mail-input" class="grupo-input">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div id="nombre-completo-input" class="grupo-input">
        <label for="nombre-completo">Nombre completo</label>
        <input id="nombre-completo" name="nombre-completo" type="text" minlength="10" maxlength="155" required>
      </div>
      <div id="contrasenna-input" class="grupo-input">
        <label for="contrasenna">Contraseña</label>
        <input id="contrasenna" name="contrasenna" type="password" required>
      </div>
      Región:
      <select id="regiones">
        <option value="">-- Seleccione región --</option>
      </select>

      Comuna:
      <select id="comunas">
        <option value="">-- Seleccione comuna --</option>
      </select>
      <div class="botones">
        <button type="button" id="envio">
          Registrarse
        </button>
      </div>
    </form>
  </div>
  <script src="./assets/js/region-comuna.js"></script>
  <script lang="javascript" src="./assets/js/controllers/registro.js"></script>
</body>

</html>
