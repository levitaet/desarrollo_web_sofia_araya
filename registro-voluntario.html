<!DOCTYPE html>
<html lang="es">

<head>
  <title>Registro de voluntarios</title>
  <link rel="stylesheet" type="text/css" href="../css/registro.css">
</head>

<body>
  <header>
    <div class="container">
      <div class="logo">
        <img id="logo-id" src="./assets/img/ave.svg" alt="Logo de ave" />
        <h1 id="bajada">Regístrate para unirte a la causa :D</h1>
      </div>
    </div>
    <nav>
      <a href="index.html">Volver a la página principal 🐦</a>
    </nav>
  </header>

  <main>
    <form class="formulario" id="login-form">
      <div id="mail-input" class="grupo-input">
        <label for="email">Email <span class="asterisco-rojo">*</span></label>
        <input id="email" name="email" type="email">
      </div>
      <div id="nombre-completo-input" class="grupo-input">
        <label for="nombre-completo">Nombre completo <span class="asterisco-rojo">*</span></label>
        <input id="nombre-completo" name="nombre-completo" type="text" minlength="10" maxlength="155">
      </div>
      <div id="contrasenna-input" class="grupo-input">
        <label for="contrasenna">Contraseña <span class="asterisco-rojo">*</span></label>
        <input id="contrasenna" name="contrasenna" type="password">
      </div>
      Región <span class="asterisco-rojo">*</span>:
      <select id="regiones">
        <option value="">-- Seleccione región --</option>
      </select>

      Comuna <span class="asterisco-rojo">*</span>:
      <select id="comunas">
        <option value="">-- Seleccione comuna --</option>
      </select>
      <div class="botones">
        <button type="button" id="envio">
          Regístrate como voluntario
        </button>
      </div>
    </form>
  </main>
  <script src="./assets/js/data/region-comuna.js"></script>
  <script src="./assets/js/controllers/registro.js"></script>
  <footer><span class="asterisco-rojo">*</span>: Este campo es obligatorio</footer>
</body>

</html>
